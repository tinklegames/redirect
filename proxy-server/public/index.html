<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Tinkle Browser</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#020617;color:#f9fafb;font:15px system-ui}main{height:100dvh;display:flex;flex-direction:column;padding:14px;gap:12px}form{display:flex;gap:8px;flex-wrap:wrap}input{flex:1;min-width:150px;background:#172033;color:inherit;border:1px solid #53607c;border-radius:12px;padding:12px}button{border:1px solid #53607c;border-radius:12px;background:#242e49;color:inherit;padding:10px 14px;cursor:pointer}button[type=submit]{background:#4f46e5}button:disabled{opacity:.5}button:focus-visible,input:focus-visible{outline:2px solid #22d3ee;outline-offset:2px}#status{margin:0;color:#cbd5e1}iframe{flex:1;width:100%;border:1px solid #53607c;border-radius:14px;background:white}h1{font-size:18px;margin:0}#welcome{padding:48px 16px;text-align:center;color:#cbd5e1}
  </style>
  <script src="/baremux/index.js" defer></script>
  <script src="/uv/uv.bundle.js" defer></script>
  <script src="/uv.config.js" defer></script>
  <script src="/browser.js" defer></script>
</head>
<body><main>
  <h1>Browser</h1>
  <form id="addressForm"><button type="button" id="back" aria-label="Go back">←</button><button type="button" id="forward" aria-label="Go forward">→</button><button type="button" id="reload" aria-label="Reload page">↻</button><input id="address" aria-label="Website address or search" placeholder="Search or enter a website" autocomplete="off" spellcheck="false" required><button id="go" type="submit">Go</button></form>
  <p id="status" role="status" aria-live="polite">Ready</p>
  <div id="welcome">Enter a website address or search above.</div>
  <iframe id="view" title="Web browser" hidden allow="fullscreen" referrerpolicy="no-referrer"></iframe>
</main></body></html>
