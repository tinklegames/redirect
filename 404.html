  /* Make the page background the desired color */
body {

  justify-content: center;
  background-color: #c7b29e;
  font-family: Arial, sans-serif;
}

  display: flex;
  align-items: center;
  justify-content: center;
  position: relative; /* needed for absolute children */
  width: 30em;
  height: 30em;
}


  .main {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    margin-top: 5em;
  }

  .antenna {
    width: 5em;
    height: 5em;
    border-radius: 50%;
    border: 2px solid black;
    background-color: #f27405;
    margin-bottom: -6em;
    margin-left: 0em;
    z-index: -1;
  }
  .antenna_shadow {
    position: absolute;
    background-color: transparent;
    width: 50px;
    height: 56px;
    margin-left: 1.68em;
    border-radius: 45%;

    border: 4px solid transparent;

      inset 0px 16px #a85103,

    -moz-box-shadow:
      inset 0px 16px #a85103,
      inset 0px 16px 1px 1px #a85103;
  }
  .antenna::after {
    content: "";
    position: absolute;
    margin-top: -9.4em;
    margin-left: 0.4em;

    width: 1em;
    height: 0.5em;
    border-radius: 50%;
    background-color: #f69e50;
  }
  .antenna::before {
    content: "";
    position: absolute;
    margin-top: 0.2em;
