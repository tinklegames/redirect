<body class="enter-code-page">
    <div id="container">
        <a href="codes.html" class="back-to-games">Back to games</a><h2>Enter Code</h2>
        <input type="text" id="codeInput" placeholder="Enter your code..." />

        <button id="submitBtn">Submit</button>

        <div id="result"></div>

        <!-- Button group for Open Page buttons -->
        <div class="button-group">
            <button id="openPageBtn" class="hidden">Play</button>
            <button id="openPrivateTabBtn" class="hidden">Open in Private Tab</button>
        </div>

        <!-- Hint for sites that cannot open in iframe -->
        <div id="iframeHint" class="hidden" style="color: yellow; margin-top: 10px;"></div>
    </div>

    <!-- Iframe container for same-tab display -->
    <div id="iframeContainer">
        <iframe id="siteFrame" allowfullscreen></iframe>
    </div>

    <div id="backslashHint">Press \ (backslash) to exit</div>

    <div id="notification" class="hidden"></div>

    <script>
        let generatedLink = "";
        let iframeAllowed = false;

        async function checkCode() {
            const code = document.getElementById('codeInput').value.trim();
            const resultDiv = document.getElementById('result');
            const submitBtn = document.getElementById('submitBtn');
            const openPageBtn = document.getElementById('openPageBtn');
            const openPrivateTabBtn = document.getElementById('openPrivateTabBtn');
            const iframeHint = document.getElementById('iframeHint');

            try {
                const response = await fetch('codes.json', { cache: 'no-store' });
                const data = await response.json();

                if (data[code]) {
                    const parts = data[code].split('|');
                    generatedLink = parts[0];
                    iframeAllowed = parts[1] === 'true';

                    document.getElementById('codeInput').value = generatedLink;
                    resultDiv.innerHTML = "link generated successfully";

                    const newBtn = submitBtn.cloneNode(true);
                    submitBtn.parentNode.replaceChild(newBtn, submitBtn);
                    newBtn.innerHTML = "Copy Link";
                    newBtn.addEventListener('click', () => copyLink(generatedLink));
                    newBtn.style.backgroundColor = "#4CAF50";

                    openPrivateTabBtn.textContent = iframeAllowed ? "Open in Private Tab" : "Open in New Tab";
                    if (iframeAllowed) {
                        openPageBtn.classList.remove("hidden");
                        openPrivateTabBtn.classList.remove("hidden");
                        iframeHint.classList.add("hidden");
                    } else {
                        openPageBtn.classList.add("hidden");
                        openPrivateTabBtn.classList.remove("hidden");
                        iframeHint.classList.remove("hidden");
                        iframeHint.textContent = "⚠️ This site cannot open in an iframe. Use 'Open in New Tab' instead.";
                    }

                    showNotification("link generated", "success");
                } else {
                    resultDiv.innerHTML = "❌ Invalid code. Try again.";
                    showNotification("❌ Invalid code. Please try again.", "error");
                    openPageBtn.classList.add("hidden");
                    openPrivateTabBtn.classList.add("hidden");
                    iframeHint.classList.add("hidden");
                }
            } catch (error) {
                console.error(error);
                resultDiv.innerHTML = "⚠️ Error fetching codes. Please try again later.";
                showNotification("⚠️ Error fetching codes. Try again later.", "error");
            }
        }

        function resetForNewCode() {
            const submitBtn = document.getElementById('submitBtn');
            const openPageBtn = document.getElementById('openPageBtn');
            const openPrivateTabBtn = document.getElementById('openPrivateTabBtn');
            const iframeHint = document.getElementById('iframeHint');
            const resultDiv = document.getElementById('result');

            const newBtn = submitBtn.cloneNode(true);
            submitBtn.parentNode.replaceChild(newBtn, submitBtn);
            newBtn.innerHTML = "Submit";
            newBtn.style.backgroundColor = "";
            newBtn.addEventListener('click', checkCode);

            openPageBtn.classList.add("hidden");
            openPrivateTabBtn.classList.add("hidden");
            iframeHint.classList.add("hidden");
            resultDiv.innerHTML = "";
            generatedLink = "";
            iframeAllowed = false;
        }

        function copyLink(link) {
            navigator.clipboard.writeText(link).then(() => {
                showNotification("🔗 Link copied to clipboard!", "success");
            }).catch(err => {
                console.error("Error copying link:", err);
                showNotification("❌ Failed to copy link.", "error");
            });
        }

        function openPage() {
            if (!generatedLink || !iframeAllowed) return;

            // Tell the TOP window that game started
            window.top.postMessage('game_started', '*');

            window.top.postMessage('hide_back_button', '*');

            const iframeContainer = document.getElementById('iframeContainer');
            const iframe = document.getElementById('siteFrame');
            const backslashHint = document.getElementById('backslashHint');

            iframe.src = generatedLink;
            iframeContainer.style.display = 'block';
            document.body.classList.add('iframe-open');

            backslashHint.classList.add('show');
            setTimeout(() => {
                backslashHint.classList.remove('show');
            }, 5000);
        }

        // New function: Open in new tab with iframe wrapper (hides URL)
        function openInPrivateTab() {
            if (!generatedLink) {
                showNotification("enter a valid code", "error");
                return;
            }

            // Games that block embedding must load directly, without an iframe wrapper.
            if (!iframeAllowed) {
                window.open(generatedLink, '_blank', 'noopener,noreferrer');
                window.top.postMessage('game_started', '*');
                return;
            }

            // Tell the TOP window that game started in private tab
            window.top.postMessage('game_started', '*');

            // Create a new blank tab
            const newTab = window.open('about:blank', '_blank');
            
            if (!newTab) {
                showNotification("⚠️ Popup blocked! Please allow popups for this site.", "error");
                return;
            }

            const iframeContainer = document.getElementById('iframeContainer');

            const backslashHint = document.getElementById('backslashHint');

            iframe.src = 'about:blank';
            iframeContainer.style.display = 'none';
            document.body.classList.remove('iframe-open');
            backslashHint.classList.remove('show');

        function showNotification(message, type) {
            const notification = document.getElementById('notification');
            notification.innerHTML = message;
            notification.className = type;
            notification.style.display = 'block';

            setTimeout(() => {
                notification.style.display = 'none';
            }, 3000);
