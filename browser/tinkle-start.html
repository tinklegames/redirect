rgin:57px 0 18px}.section h2{font-size:12px;letter-spacing:.16em;color:#9ea4b3;text-transform:uppercase;margin:0}.section span{font-size:12px;color:#747c8c}.links{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}.tile{text-decoration:none;color:#f1f2f8;display:flex;align-items:center;gap:14px;text-align:left;background:#ffffff09;border:1px solid #ffffff16;border-radius:17px;padding:20px 18px;transition:background .2s,border-color .2s,transform .2s}.tile:hover{background:#ffffff13;border-color:#e4bb675e;transform:translateY(-3px)}.tile img{height:29px;width:29px;object-fit:contain}.tile strong{display:block;font-size:15px}.tile small{display:block;color:#848c9d;font-size:11px;margin-top:3px}.foot{margin-top:58px;color:#6f7687;font-size:12px}.foot a{color:#d7b36f;text-decoration:none}@media(max-width:600px){.links{grid-template-columns:repeat(2,1fr)}.tile{padding:16px 12px;gap:10px}.top{padding:20px}.search button{padding:13px}.section{margin-top:40px}}
</style></head><body><header class="top"><div class="brand">TINKLE <span>GAMES</span></div></header><main class="center"><div class="symbol" aria-label="Tinkle Games"><svg viewBox="0 0 64 64" width="42" height="42" aria-hidden="true"><path d="M32 5 39 25 59 32 39 39 32 59 25 39 5 32 25 25Z" fill="#efc66d"/><path d="M48 7 50 14 57 16 50 18 48 25 46 18 39 16 46 14Z" fill="#f7e2a9"/></svg></div><h1>Where to <em>next?</em></h1><p class="sub">A fresh start. A whole internet to explore.</p><form class="search" id="search"><svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><input id="q" aria-label="Search or enter a website" placeholder="Search the web or enter a URL..." autocomplete="off" autofocus><button type="submit">Go →</button></form><div class="section"><h2>Quick access</h2><span>YOUR FAVORITES</span></div><div class="links" id="links"></div><div class="foot">Powered by Gecko · Made for <a href="https://historystudyguide.github.io/">Tinkle Games</a></div></main><script>
const sites=[['TikTok','tiktok.com','https://www.tiktok.com/'],['YouTube','youtube.com','https://www.youtube.com/'],['X','x.com','https://x.com/'],['Snapchat','snapchat.com','https://www.snapchat.com/'],['Instagram','instagram.com','https://www.instagram.com/'],['Pinterest','pinterest.com','https://www.pinterest.com/']];
const links=document.getElementById('links');for(const [name,domain,url] of sites){const a=document.createElement('a');a.className='tile';a.href=url;const img=document.createElement('img');img.src='https://www.google.com/s2/favicons?domain='+encodeURIComponent(domain)+'&sz=64';img.alt='';const t=document.createElement('span');const strong=document.createElement('strong');strong.textContent=name;const small=document.createElement('small');small.textContent=domain;t.append(strong,small);a.append(img,t);links.append(a)}
document.getElementById('search').addEventListener('submit',e=>{e.preventDefault();const raw=document.getElementById('q').value.trim();if(!raw)return;let dest;if(/^https?:\/\//i.test(raw))dest=raw;else if(/^(localhost|127\.0\.0\.1)(:\d+)?(\/.*)?$/.test(raw)||(/^[^\s]+\.[a-z]{2,}(\/[^\s]*)?$/i.test(raw)))dest='https://'+raw;else dest='https://www.google.com/search?q='+encodeURIComponent(raw);location.href=dest});
</script></body></html>
