  <!-- Register the isolation worker BEFORE starting the Firefox application. -->
  <script>
  (() => {
    if (window.crossOriginIsolated) return;
    // The Firefox worker pool requires cross-origin isolation.
    // Registration controls only this browser/ directory, not the parent website.
    if (!window.isSecureContext || !('serviceWorker' in navigator)) {
      document.addEventListener('DOMContentLoaded', () => {
        const el = document.getElementById('splash-status');
        if (el) el.textContent = 'Tinkle Browser requires HTTPS and service worker support.';
      });
      return;
    }
    navigator.serviceWorker.register('./coi-serviceworker.js', {scope:'./'})
      .then(async registration => {
        await navigator.serviceWorker.ready;
        if (!navigator.serviceWorker.controller) {
          console.log('[Tinkle Browser] COI service worker installed; reloading to activate isolation');
          location.reload();
        } else {
          console.warn('[Tinkle Browser] Service worker controls this page but crossOriginIsolated is false. Check iframe and response policies.');
        }
      }).catch(err => console.error('[Tinkle Browser] COI service worker registration failed:', err));
  })();
  </script>
  <!-- Stream the Gecko WASM chunks in order when the app fetches gecko.wasm. -->
  <script>
  (() => {
    const originalFetch = window.fetch.bind(window);
    const partSize = 20_000_000;
    const total = 237_419_606;
    const partCount = Math.ceil(total / partSize);
    const isWasmRequest = input => {
      try {
        const url = new URL(typeof input === 'string' || input instanceof URL ? input : input.url, location.href);
        return url.origin === location.origin && url.pathname.endsWith('/gecko.wasm');
      } catch { return false; }
    };
    window.fetch = function(input, init) {
      if (!isWasmRequest(input)) return originalFetch(input, init);
      const request = new Request(input, init);
      const directory = new URL('./gecko-wasm/', request.url);
      let current = 0;
      let activeReader = null;
      let partBytes = 0;
      const stream = new ReadableStream({
        async pull(controller) {
          try {
            while (true) {
              if (current >= partCount) { controller.close(); return; }
              const expectedSize = Math.min(partSize, total - current * partSize);
              if (!activeReader) {
                const url = new URL('gecko.wasm.part' + (current + 1), directory);
                const response = await originalFetch(url, { signal: request.signal, cache: 'default' });
                if (!response.ok || !response.body) throw new Error('WASM part ' + (current + 1) + ': HTTP ' + response.status);
                partBytes = 0;
                activeReader = response.body.getReader();
              }
              const result = await activeReader.read();
              if (result.done) {
                if (partBytes !== expectedSize) throw new Error('WASM part ' + (current + 1) + ' downloaded ' + partBytes + ' bytes; expected ' + expectedSize + '. Check the deployed gecko-wasm files.');
                activeReader.releaseLock(); activeReader = null; current++; continue;
              }
              partBytes += result.value.byteLength;
              controller.enqueue(result.value);
              return;
            }
          } catch (error) { controller.error(error); }
        },
        cancel(reason) { if (activeReader) return activeReader.cancel(reason); }
      });
      console.info('[Tinkle Browser] Loading Gecko WASM from ' + partCount + ' parts');
      return Promise.resolve(new Response(stream, {
        status: 200,
        headers: { 'Content-Type': 'application/wasm', 'Content-Length': String(total) }
      }));
    };
  })();
  </script>
