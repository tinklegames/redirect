<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Game image checker</title>
  <style>
    body { font: 16px system-ui, sans-serif; max-width: 1100px; margin: 40px auto; padding: 0 20px; background: #101827; color: #eef2ff; }
    button { padding: 10px 16px; margin: 4px; cursor: pointer; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    th, td { text-align: left; padding: 10px; border-bottom: 1px solid #475569; vertical-align: top; }
    a { color: #93c5fd; overflow-wrap: anywhere; }
    .failed, .timeout, .missing { color: #fca5a5; }
    .loaded { color: #86efac; }
  </style>
</head>
<body>
  <h1>Game image checker</h1>
  <p>Tests the images in game-cards.js using your browser. Failed loads may mean a removed image, hotlink protection, or a network block. Timeouts are inconclusive. No image URLs are changed.</p>
  <button id="run">Test image links</button>
  <button id="download" disabled>Download failed / timed-out links</button>
  <label><input id="onlyProblems" type="checkbox" checked> Show only problems</label>
  <p id="status" role="status" aria-live="polite">Ready.</p>
  <table>
    <thead><tr><th>Game / code</th><th>Result</th><th>Image src</th></tr></thead>
    <tbody id="results"></tbody>
  </table>
  <script src="game-cards.js"></script>
  <script src="check-images.js"></script>
</body>
</html>
