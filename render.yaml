# Deploy only the browser server. The main game site stays on GitHub Pages.
services:
  - type: web
    name: tinkle-browser
    runtime: node
    plan: free
    rootDir: proxy-server
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: NODE_VERSION
        value: 24.11.1
